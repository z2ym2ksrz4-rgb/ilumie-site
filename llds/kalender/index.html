<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Kalender – LL Dance Studio</title><link rel="icon" href="/llds/favicon.png">
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0a0b;color:#f2efe8;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;display:flex;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom))}main{width:100%;max-width:460px}
